name: CI Quality Gates

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  web-mobile-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Architecture hotspot report
        run: npm run architecture:report

      - name: Frontend lint
        run: npm run lint --workspace frontend

      - name: Frontend tests
        run: npm run test --workspace frontend

      - name: Frontend production build
        run: npm run build --workspace frontend

      - name: Shared API contract tests
        run: npx vitest run packages/family-api/src/*.test.ts --environment node

      - name: Mobile quality and Expo dependency alignment
        run: npm run mobile:gate

      - name: Dependency-audit exception contract tests
        run: node --test scripts/*.test.mjs

      - name: Frontend runtime dependency audit
        run: npm audit --workspace frontend --omit=dev --audit-level=high

      - name: Mobile runtime dependency audit
        run: bash scripts/audit-mobile-runtime-dependencies.sh

  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend and audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"
          pip install pip-audit

      - name: Full backend test suite
        run: pytest backend/tests -q

      - name: Architecture dependency boundaries
        run: python scripts/architecture-report.py --strict

      - name: Explicit fresh migration gate
        run: pytest backend/tests/test_alembic_migrations.py::test_alembic_upgrade_head_creates_family_manager_schema -q

      - name: Python dependency audit
        run: pip-audit --strict backend
